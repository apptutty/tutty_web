name: E2E Tests (Admin / Web)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI: true
      E2E_BASE_URL: http://localhost:4210
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      QA_SUPER_ADMIN_EMAIL: ${{ secrets.QA_SUPER_ADMIN_EMAIL }}
      QA_SUPER_ADMIN_PASSWORD: ${{ secrets.QA_SUPER_ADMIN_PASSWORD }}
      QA_STORE_ADMIN_EMAIL: ${{ secrets.QA_STORE_ADMIN_EMAIL }}
      QA_STORE_ADMIN_PASSWORD: ${{ secrets.QA_STORE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (traces/screenshots/videos)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: e2e/test-results/
          retention-days: 14
